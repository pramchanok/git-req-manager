<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Updating GitLab MR Manager</title>
  <style>
    /* Base reset & typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      /* Transparent background so window transparency works */
      background: transparent;
    }
    /* Main container matching our theme */
    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111827; /* slate-900 */
      border: 1px solid #374151; /* slate-700 */
      border-radius: 12px;
      color: #f9fafb;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    /* Logo styling */
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    /* Typography */
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f9fafb;
    }
    #status {
      font-size: 0.875rem;
      color: #9ca3af; /* slate-400 */
      margin-bottom: 24px;
      text-align: center;
    }
    /* Progress bar container */
    .progress-container {
      width: 80%;
      height: 8px;
      background: #374151; /* slate-700 */
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    /* Actual progress bar */
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #f97316; /* orange-500 */
      border-radius: 4px;
      transition: width 0.2s ease;
    }
    /* Indeterminate animation (for checking updates) */
    .progress-indeterminate {
      position: absolute;
      width: 30%;
      height: 100%;
      background: #f97316;
      border-radius: 4px;
      animation: sliding 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.9; }
    }
    @keyframes sliding {
      0% { left: -30%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="icon.png" alt="Logo" class="logo" />
    <h1>GitLab MR Manager</h1>
    <p id="status">Starting up...</p>
    
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar" style="display: none;"></div>
      <div id="progress-indeterminate" class="progress-indeterminate"></div>
    </div>
  </div>

  <script>
    // Listen for events from preload script
    if (window.splashAPI) {
      window.splashAPI.onUpdateStatus((text) => {
        document.getElementById('status').innerText = text;
      });

      window.splashAPI.onUpdateProgress((percent) => {
        // Switch to determinate progress bar when we start downloading
        document.getElementById('progress-indeterminate').style.display = 'none';
        const pBar = document.getElementById('progress-bar');
        pBar.style.display = 'block';
        pBar.style.width = percent + '%';
        
        document.getElementById('status').innerText = `Downloading update... ${Math.round(percent)}%`;
      });

      window.splashAPI.onInstallationMode(() => {
        document.getElementById('status').innerText = 'Setting up application...';
        document.getElementById('progress-indeterminate').style.display = 'none';
        const pBar = document.getElementById('progress-bar');
        pBar.style.display = 'block';
        
        let p = 0;
        const i = setInterval(() => {
          p += 5;
          pBar.style.width = p + '%';
          if (p >= 100) {
            clearInterval(i);
            document.getElementById('status').innerText = 'Ready!';
          }
        }, 100);
      });
    }
  </script>
</body>
</html>
