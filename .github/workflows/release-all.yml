name: Release All Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match package.json and CHANGELOG.md)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          TAG="v${PACKAGE_VERSION}"

          if ! echo "$REQUESTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid requested version: ${REQUESTED_VERSION}"
            exit 1
          fi

          if [ "$REQUESTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested version ${REQUESTED_VERSION} does not match package.json ${PACKAGE_VERSION}."
            exit 1
          fi

          if [ "$LOCK_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "package-lock.json ${LOCK_VERSION} does not match package.json ${PACKAGE_VERSION}."
            exit 1
          fi

          if ! grep -Fq "## [${PACKAGE_VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${PACKAGE_VERSION}."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Bump the version before releasing again."
            exit 1
          fi

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag ${TAG} already points to ${TAG_SHA}, not workflow commit ${GITHUB_SHA}."
              echo "Delete the unreleased tag or bump the version before retrying."
              exit 1
            fi
            echo "Tag ${TAG} already exists at this commit; treating this as a safe retry."
          fi

          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  publish-mac:
    needs: prepare
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: "https://infisical.igenco.dev"
          env-slug: "prod"
          project-slug: "gitlab-mr-manager-h-d-tb"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package macOS app
        run: npm run package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  publish-windows:
    needs: publish-mac
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package Windows app
        run: npm run package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  publish-linux:
    needs: publish-mac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package Linux app
        run: npm run package:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  finalize:
    needs: [prepare, publish-mac, publish-windows, publish-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk "/^## \[${VERSION}\]/{flag=1; next} /^---$/{if(flag) exit} flag" CHANGELOG.md > release-notes.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and rename artifacts
        run: |
          mkdir release-files
          find artifacts -type f | while read -r file; do
            name=$(basename "$file")
            new_name=$(echo "$name" | tr ' ' '-')
            cp "$file" "release-files/$new_name"
          done

      - name: Create release tag after successful builds
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --tags origin

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${TAG_SHA}, not workflow commit ${RELEASE_SHA}."
              echo "Refusing to move an existing release tag."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at the correct commit."
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
            echo "Created ${RELEASE_TAG} at ${RELEASE_SHA}."
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo pramchanok/git-req-manager >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Refusing to overwrite it."
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-files/* \
            --verify-tag \
            --notes-file release-notes.txt \
            --title "${VERSION}" \
            --repo pramchanok/git-req-manager
