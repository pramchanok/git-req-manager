name: Release All Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-mac:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: "https://infisical.igenco.dev"
          env-slug: "prod"
          project-slug: "gitlab-mr-manager-h-d-tb"

      - name: Install dependencies
        run: npm ci

      - name: Publish macOS release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder v26: notarize:true reads teamId from APPLE_TEAM_ID env
          APPLE_TEAM_ID: "57TK5HXL9A"
        run: npm run publish:mac

  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Publish Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run publish:win

  finalize:
    needs: [publish-mac, publish-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk "/^## \[${VERSION}\]/{flag=1; next} /^---$/{if(flag) exit} flag" CHANGELOG.md > release-notes.txt

      - name: Update GitHub release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --notes-file release-notes.txt --repo pramchanok/git-req-manager
