# Backup workflow for macOS release.
# Re-enable by adding the required secrets:
#   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
#
# When re-enabling Mac support:
#   1. Set releaseType to "draft" in package.json
#   2. Add finalize job (see finalize-release.yml) to release-all.yml after both platforms publish
#   3. Re-add publish-mac job below to release-all.yml

name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-mac:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk "/^## \[${VERSION}\]/{flag=1; next} /^---$/{if(flag) exit} flag" CHANGELOG.md > release-notes.txt

      - name: Publish macOS release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run publish:mac

      - name: Update GitHub release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --notes-file release-notes.txt --repo pramchanok/git-req-manager
