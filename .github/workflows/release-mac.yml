# Backup workflow for macOS release.
# Secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD)
# are pulled from self-hosted Infisical. Only INFISICAL_CLIENT_ID and
# INFISICAL_CLIENT_SECRET need to be stored in GitHub secrets.
#
# When re-enabling Mac support alongside Windows:
#   1. Set releaseType to "draft" in package.json
#   2. Add finalize job (see finalize-release.yml) after both platforms publish

name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-mac:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: "https://infisical.igenco.dev"
          env-slug: "prod"
          project-slug: "gitlab-mr-manager-h-d-tb"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk "/^## \[${VERSION}\]/{flag=1; next} /^---$/{if(flag) exit} flag" CHANGELOG.md > release-notes.txt

      - name: Publish macOS release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder v26: notarize:true reads teamId from APPLE_TEAM_ID env
          APPLE_TEAM_ID: "57TK5HXL9A"
        run: npm run publish:mac

      - name: Update GitHub release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --notes-file release-notes.txt --repo pramchanok/git-req-manager
